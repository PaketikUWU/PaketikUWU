name: Snake eats commits

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # «змейка» ползёт по графику активности и съедает клетки-коммиты
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0B0B0D&color_dots=#f2e6d8,#ffc9a3,#ff9a5a,#f25c05,#d10920
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2E6D8&color_dots=#161b22,#4e1017,#941423,#e11d34,#ff7a1a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

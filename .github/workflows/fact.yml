name: Факт дня

on:
  schedule:
    - cron: "0 0 * * *" # каждый день в 03:00 по Москве (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать факт
        run: python3 .github/scripts/fact.py
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md facts/log.json
          git diff --cached --quiet || git commit -m "📚 Факт дня"
          git pull --rebase
          git push

name: Шахта дня

on:
  schedule:
    - cron: "0 6 * * *" # каждый день в 09:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Спуститься в шахту
        run: python3 .github/scripts/mine.py
      - name: Сохранить добычу
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mine/log.json
          git diff --cached --quiet || git commit -m "⛏️ Шахта дня"
          git pull --rebase
          git push
